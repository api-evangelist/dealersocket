name: DealerSocket
kind: company
description: >-
  DealerSocket is an automotive dealership CRM and Dealer Management System
  (DMS) software platform for franchise and independent auto dealers, covering
  customer relationship management, inventory management, websites, digital
  marketing, and desking/deals. DealerSocket is a Solera company (acquired 2021;
  part of Solera's Vehicle Solutions line of business). DealerSocket exposes a
  set of inbound and outbound integration APIs - lead forwarding, deal push to
  the DMS, customer updates, activity and CTI/call logging - but access is not
  self-serve. It is delivered through DealerSocket's Certified Partners program
  (launched 2013, 500-plus integration points) and is application-, contract-,
  and certification-gated. There is no public developer portal, no published
  authentication reference, and no public endpoint or base-URL documentation;
  the logical APIs below are modeled from DealerSocket's public integrations
  page rather than a self-serve API reference.
