source: >-
  Registry searches against npm, PyPI, RubyGems, NuGet, Packagist and crates.io,
  plus a GitHub code/repo search, on 2026-08-10.
summary:
  official_client_sdks: 0
  official_packages: 4
  note: >-
    DealerSocket publishes NO client SDK for its partner integration APIs, in any
    language. The only first-party packages that exist are four ASP.NET internal
    platform framework libraries pushed to NuGet in 2014 - server-side scaffolding
    for building DealerSocket's own services, not client libraries a partner
    integrates with. Because there is no official client library, NO `SDKs`
    pointer is emitted in apis.yml; only `Packages`. Every one of these packages
    is more than a decade stale and points at a Bitbucket project URL, which is a
    strong abandonment signal for the published-package surface.
